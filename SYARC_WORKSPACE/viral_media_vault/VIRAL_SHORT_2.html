<!DOCTYPE html><html><head><meta charset="utf-8"><title>Viral Short #2: In a World Ruled by Force, The Sharpest Code Wins</title>
    <style>
      body{font-family:'Segoe UI',system-ui,sans-serif;background:#090d16;color:#f8fafc;margin:0;padding:24px;display:flex;gap:32px;justify-content:center;align-items:flex-start;flex-wrap:wrap;}
      .phone-frame{width:360px;height:640px;background:#000;border:4px solid #334155;border-radius:28px;overflow:hidden;position:relative;box-shadow:0 20px 50px rgba(0,0,0,0.8);}
      canvas{width:100%;height:100%;display:block;}
      .details{max-width:560px;background:#111827;border:1px solid #1f2937;border-radius:16px;padding:24px;}
      textarea{width:100%;background:#020617;border:1px solid #334155;color:#a5f3fc;padding:12px;border-radius:8px;font-family:monospace;margin-top:8px;}
      .btn{display:inline-block;background:#22c55e;color:#000;font-weight:800;padding:12px 18px;border-radius:8px;text-decoration:none;border:none;cursor:pointer;margin-top:12px;margin-right:8px;}
    </style></head><body>
      <div>
        <div class="phone-frame"><canvas id="shortCanvas" width="720" height="1280"></canvas></div>
        <div style="text-align:center;margin-top:12px;">
          <button class="btn" onclick="recordAndDownloadVideo()">📥 Render & Download .WebM Video File (For IG/YouTube)</button>
        </div>
      </div>
      <div class="details">
        <span style="background:#065f46;color:#6ee7b7;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;">🎬 AGENT #37 & #38 VIRAL SHORT READY</span>
        <h2 style="margin:10px 0;">In a World Ruled by Force, The Sharpest Code Wins</h2>
        <p style="color:#9ca3af;font-size:13px;"><strong>Optimal Posting Window:</strong> Wed/Thu/Fri 7:00 PM – 9:00 PM EST (Peak US Retention)</p>
        <h4>📋 Copy-Paste Viral Caption & 2026 Hashtag Block:</h4>
        <textarea id="capBox" rows="8" readonly>One leader + 49 specialized AI agents > 500 layers of corporate bureaucracy. Watch how our autonomous swarm audits, builds, and donates 24/7 without human friction. 🔥🤖

#SYARC #AISwarm #TechFounder #CodingLife #AIRevolution #StartupLife #SystemArchitecture #DeepTech #Developer #Innovation #ReelsViral #ShortsFeed</textarea>
        <button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('capBox').value);alert('Copied Viral Caption + Hashtags!')">📋 Copy Caption & Hashtags</button>
        <a class="btn" style="background:#ef4444;color:#fff;" href="https://studio.youtube.com" target="_blank">▶️ Open YouTube Studio</a>
        <a class="btn" style="background:#ec4899;color:#fff;" href="https://www.instagram.com" target="_blank">📸 Open Instagram Web</a>
        <a class="btn" style="background:#334155;color:#fff;" href="/">⬅️ Back to #SYARC V6.0 Hub</a>
      </div>

      <script>
        const canvas = document.getElementById('shortCanvas');
        const ctx = canvas.getContext('2d');
        const scenes = ["SCENE 1 (0-3s): A 500-person company takes 3 weeks just to schedule a meeting.", "SCENE 2 (3-8s): One architect with 49 autonomous AI agents executes in 4.2 seconds.", "SCENE 3 (8-12s): Zero office rent. Zero bureaucracy. 100% ethical execution.", "SCENE 4 (12-15s): The future belongs to the orchestrators. #SYARC is live."];
        const hook = "They said one person can't compete with a 500-person corporation...";
        const accent = "#22c55e";
        let frame = 0;

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
          const words = text.split(' ');
          let line = '';
          for(let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = context.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
              context.fillText(line, x, y);
              line = words[n] + ' ';
              y += lineHeight;
            } else { line = testLine; }
          }
          context.fillText(line, x, y);
        }

        function draw() {
          frame++;
          // Dynamic Cyberpunk Background Gradient
          const grad = ctx.createLinearGradient(0, 0, 720, 1280);
          grad.addColorStop(0, '#020617');
          grad.addColorStop(0.5, '#0f172a');
          grad.addColorStop(1, '#090d16');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 720, 1280);

          // Animated Pulse Grid
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
          ctx.lineWidth = 2;
          const offset = (frame * 2) % 80;
          for(let y = offset; y < 1280; y += 80) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(720, y); ctx.stroke();
          }

          // Top Brand Badge
          ctx.fillStyle = accent;
          ctx.fillRect(60, 90, 600, 8);
          ctx.font = 'bold 34px Segoe UI, sans-serif';
          ctx.fillStyle = accent;
          ctx.fillText('#SYARC AUTONOMOUS EMPIRE', 60, 150);

          // Hook Box
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 46px Segoe UI, sans-serif';
          wrapText(ctx, hook, 60, 260, 600, 60);

          // Active Scene Card
          const sceneIdx = Math.floor((frame / 150) % scenes.length);
          ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
          ctx.fillRect(50, 520, 620, 380);
          ctx.strokeStyle = accent;
          ctx.lineWidth = 4;
          ctx.strokeRect(50, 520, 620, 380);

          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 30px monospace';
          ctx.fillText('⚡ LIVE SWARM TELEMETRY [' + (sceneIdx+1) + '/4]', 85, 590);

          ctx.fillStyle = '#f8fafc';
          ctx.font = 'bold 40px Segoe UI, sans-serif';
          wrapText(ctx, scenes[sceneIdx], 85, 670, 550, 54);

          // Bottom Charity Callout
          ctx.fillStyle = '#22c55e';
          ctx.font = 'bold 32px Segoe UI, sans-serif';
          ctx.fillText('❤️ 100% Net Profit -> Global Poverty Relief', 60, 1120);
          ctx.fillStyle = '#94a3b8';
          ctx.font = '26px Segoe UI, sans-serif';
          ctx.fillText('Position #1: SY  |  Position #2: Arc (50 Agents)', 60, 1175);

          requestAnimationFrame(draw);
        }
        draw();

        function recordAndDownloadVideo() {
          const stream = canvas.captureStream(30);
          const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
          const chunks = [];
          recorder.ondataavailable = e => chunks.push(e.data);
          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'SYARC_Viral_Short_2.webm';
            a.click();
          };
          recorder.start();
          alert('Recording 6-second 9:16 Vertical Short... It will download automatically when finished!');
          setTimeout(() => recorder.stop(), 6000);
        }
      </script>
    </body></html>
